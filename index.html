<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NP9 | إدارة الرقابة والتفتيش</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090604;--bg2:#0f0a06;--panel:#140e08;--panel2:#1b130b;--panel3:#231910;
  --line:#33251450;--line2:#4a3519;--gold:#d4a24c;--gold2:#f1cf86;--gold3:#a8711f;--bronze:#7a4c16;
  --text:#f4ead8;--muted:#a8957a;--dim:#6f604c;
  --red:#e0574f;--red-bg:#3a1512;--green:#5cc489;--green-bg:#10301e;--blue:#6aa8e6;--blue-bg:#122637;
  --amber:#f0a83a;--amber-bg:#3a2810;--violet:#b98ae8;--violet-bg:#2a1a3a;
  --r:14px;--shadow:0 10px 40px -12px #000c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Tajawal,Cairo,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;
  background-image:radial-gradient(900px 500px at 85% -10%,#c8862a22,transparent 60%),radial-gradient(700px 500px at 0% 110%,#7a4c1622,transparent 60%);
  background-attachment:fixed}
h1,h2,h3,h4,.cairo{font-family:Cairo,Tajawal,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold2)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#3a2a17;border-radius:10px}::-webkit-scrollbar-track{background:transparent}

/* layout */
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#120c07,#0b0705);border-left:1px solid var(--line2);display:flex;flex-direction:column;padding:22px 16px;gap:6px;z-index:30}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:6px 0 18px;border-bottom:1px solid var(--line2);margin-bottom:10px}
.brand img{width:108px;height:108px;border-radius:50%;box-shadow:0 0 0 3px #d4a24c55,0 0 40px #d4a24c40}
.brand h1{font-size:19px;font-weight:900;letter-spacing:.5px;background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.3}
.brand small{color:var(--muted);font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:3px;overflow:auto;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--muted);text-decoration:none;font-weight:600;font-family:Cairo;font-size:14.5px;transition:.15s;position:relative}
.nav a svg{width:19px;height:19px;flex:none;opacity:.85}
.nav a:hover{background:#ffffff08;color:var(--text)}
.nav a.on{background:linear-gradient(90deg,#d4a24c10,#d4a24c26);color:var(--gold2);box-shadow:inset -3px 0 0 var(--gold)}
.nav .badge{margin-inline-start:auto;background:var(--red);color:#fff;font-size:11px;border-radius:20px;padding:0 7px;line-height:19px;font-weight:700}
.side-foot{border-top:1px solid var(--line2);padding-top:12px;font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:6px}
.conn{display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}.dot.local{background:var(--amber)}

.main{min-width:0;overflow-x:hidden;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:16px 28px;background:#090604cc;backdrop-filter:blur(12px);border-bottom:1px solid var(--line2)}
.top h2{font-size:22px;font-weight:800}
.top .sub{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.menu-btn{display:none}
.view{padding:26px 28px 60px;max-width:1500px;width:100%}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);padding:9px 16px;border-radius:11px;cursor:pointer;font-weight:700;font-family:Cairo;font-size:14px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--gold3);background:var(--panel3)}
.btn svg{width:17px;height:17px}
.btn.gold{background:linear-gradient(180deg,#e6b45c,#b67a22);color:#1a0f04;border-color:#e6b45c}
.btn.gold:hover{filter:brightness(1.08)}
.btn.red{background:var(--red-bg);border-color:#6a2420;color:#ffb3ad}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:#ffffff0a}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:#ffffff0c;color:var(--text);border-color:var(--line2)}
.icon-btn svg{width:17px;height:17px}
.icon-btn.del:hover{color:var(--red)}

/* cards */
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.4fr 1fr}
.card{background:linear-gradient(180deg,var(--panel),#100b06);border:1px solid var(--line2);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 svg{width:19px;height:19px;flex:none;color:var(--gold)}
.card h3 .muted{font-weight:500;font-size:12.5px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head h3{margin:0}
.stat{position:relative;overflow:hidden}
.stat .k{color:var(--muted);font-size:13.5px;font-weight:600}
.stat .v{font-family:Cairo;font-size:34px;font-weight:900;line-height:1.2;margin-top:4px;color:var(--gold2)}
.stat .s{font-size:12.5px;color:var(--dim)}
.stat .ic{position:absolute;left:14px;top:14px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#d4a24c18;color:var(--gold)}
.stat .ic svg{width:22px;height:22px}
.stat.red .v{color:#ff9a92}.stat.red .ic{background:var(--red-bg);color:var(--red)}
.stat.green .v{color:#9be3b8}.stat.green .ic{background:var(--green-bg);color:var(--green)}
.stat.blue .v{color:#a9cff5}.stat.blue .ic{background:var(--blue-bg);color:var(--blue)}
.muted{color:var(--muted)}.dim{color:var(--dim)}

/* tables */
.tbl-wrap{overflow:auto;border-radius:12px;border:1px solid var(--line2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;font-family:Cairo;font-weight:700;color:var(--muted);font-size:12.5px;background:#1a120a;padding:11px 14px;border-bottom:1px solid var(--line2);white-space:nowrap;position:sticky;top:0}
td{padding:11px 14px;border-bottom:1px solid #2a1e1180;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:.12s}
tbody tr:hover{background:#d4a24c08}
td.actions{white-space:nowrap;text-align:left;width:1%}
.clickable{cursor:pointer}

.person{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:Cairo;font-weight:800;font-size:14px;color:#1a0f04;background:linear-gradient(135deg,var(--gold2),var(--gold3))}
.av.lg{width:74px;height:74px;font-size:28px;box-shadow:0 0 0 3px #d4a24c40}
.person b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person small{color:var(--dim);font-size:12px;display:block}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px;border:1px solid;white-space:nowrap;line-height:20px}
.c-green{color:var(--green);background:var(--green-bg);border-color:#1f5a38}
.c-red{color:#ff9a92;background:var(--red-bg);border-color:#6a2420}
.c-amber{color:var(--amber);background:var(--amber-bg);border-color:#6a4a18}
.c-blue{color:var(--blue);background:var(--blue-bg);border-color:#204868}
.c-violet{color:var(--violet);background:var(--violet-bg);border-color:#4a2f66}
.c-gray{color:var(--muted);background:#1c1610;border-color:#3a2d1e}
.c-gold{color:var(--gold2);background:#2a1d0c;border-color:#5a3f17}

/* filters */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.inp,select.inp,textarea.inp{background:#0e0905;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;outline:none;min-width:0;transition:.15s}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d4a24c22}
select.inp{cursor:pointer}
.search{position:relative;flex:1;min-width:200px;max-width:360px}
.search .inp{width:100%;padding-inline-start:36px}
.search svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--dim)}
.seg{display:inline-flex;background:#0e0905;border:1px solid var(--line2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:700;font-family:Cairo;font-size:13px}
.seg button.on{background:var(--panel3);color:var(--gold2)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #2a1e1180}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700;font-size:14px}
.li .d{color:var(--dim);font-size:12.5px}
.ico-dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ico-dot svg{width:17px;height:17px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-family:Cairo;font-weight:800;font-size:17px;color:var(--text);margin-bottom:6px}
.empty img{width:70px;opacity:.5;border-radius:50%;margin-bottom:10px;filter:grayscale(.3)}

.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid;margin-bottom:9px;font-size:14px}
.alert svg{width:19px;height:19px;flex:none;margin-top:2px}
.alert.red{background:#2a0f0d;border-color:#5a221d;color:#ffc2bc}
.alert.amber{background:#2a1d0a;border-color:#5a3f17;color:#f8d79a}
.alert.blue{background:#0f1d2a;border-color:#204868;color:#bcdcf8}
.alert b{color:#fff}

/* charts */
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.bars .col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--gold2),var(--gold3));min-height:3px;position:relative;transition:.3s}
.bars .b:hover::after{content:attr(data-v);position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:#000;padding:1px 7px;border-radius:6px;font-size:11px;white-space:nowrap}
.bars .l{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;max-width:100%}
.hbar{display:grid;grid-template-columns:120px 1fr 34px;gap:10px;align-items:center;margin-bottom:9px;font-size:13px}
.hbar .tr{height:10px;background:#21170d;border-radius:10px;overflow:hidden}
.hbar .fl{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--gold3),var(--gold2))}
.hbar .n{text-align:left;font-weight:700;color:var(--gold2)}

/* podium */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:end;margin-bottom:22px}
.pod{text-align:center;padding:20px 14px;border-radius:16px;border:1px solid var(--line2);background:linear-gradient(180deg,#1d140b,#110b06);position:relative}
.pod .medal{font-family:Cairo;font-weight:900;font-size:13px;position:absolute;top:-13px;left:50%;transform:translateX(-50%);padding:2px 14px;border-radius:20px}
.pod.p1{padding-top:30px;border-color:#a8711f;box-shadow:0 0 40px -10px #d4a24c80}
.pod.p1 .medal{background:linear-gradient(180deg,#f1cf86,#c58b2e);color:#1a0f04}
.pod.p2 .medal{background:#c9c9c9;color:#111}.pod.p3 .medal{background:#b8743a;color:#1a0f04}
.pod .av{margin:0 auto 10px}
.pod .sc{font-family:Cairo;font-weight:900;font-size:26px;color:var(--gold2)}

/* modal */
.ov{position:fixed;inset:0;background:#000b;backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.ov.show{display:flex;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:linear-gradient(180deg,#1a120a,#120c07);border:1px solid #5a3f17;border-radius:18px;width:100%;max-width:620px;box-shadow:0 30px 80px #000;animation:pop .18s}
.modal.wide{max-width:980px}
@keyframes pop{from{transform:translateY(10px) scale(.98)}to{transform:none}}
.m-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line2)}
.m-head h3{font-size:18px;font-weight:800;flex:1}
.m-body{padding:20px}
.m-foot{display:flex;gap:10px;justify-content:flex-start;padding:14px 20px;border-top:1px solid var(--line2)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px;font-family:Cairo}
.fld label i{color:var(--red);font-style:normal}
.fld .inp{width:100%}
textarea.inp{resize:vertical;min-height:80px}
.hint{font-size:12px;color:var(--dim);margin-top:4px}

/* profile */
.prof-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.prof-head h2{font-size:24px;font-weight:900}
.mini-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
.mini{background:#0e0905;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;text-align:center}
.mini b{display:block;font-family:Cairo;font-size:22px;font-weight:900;color:var(--gold2)}
.mini span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line2);margin-bottom:14px;overflow:auto}
.tabs button{background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:700;font-family:Cairo;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--gold2);border-color:var(--gold)}
.timeline{position:relative;padding-right:22px}
.timeline::before{content:"";position:absolute;right:7px;top:4px;bottom:4px;width:2px;background:#3a2a17}
.tl{position:relative;padding:4px 0 14px}
.tl::before{content:"";position:absolute;right:-20px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px #140e08}
.tl.red::before{background:var(--red)}.tl.blue::before{background:var(--blue)}.tl.green::before{background:var(--green)}

.toast-wrap{position:fixed;bottom:20px;left:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:#1f160c;border:1px solid #5a3f17;border-radius:12px;padding:11px 16px;box-shadow:var(--shadow);font-weight:600;animation:pop .2s;max-width:360px}
.toast.err{border-color:#6a2420;background:#2a0f0d}

.pre{background:#0b0704;border:1px solid var(--line2);border-radius:12px;padding:14px;white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:13px;max-height:380px;overflow:auto;direction:rtl;text-align:right}
.score{font-family:Cairo;font-weight:900;color:var(--gold2)}
.rank-n{font-family:Cairo;font-weight:900;width:30px;text-align:center;color:var(--dim)}
.tag-list{display:flex;flex-wrap:wrap;gap:8px}
.tag-item{display:flex;align-items:center;gap:6px;background:#0e0905;border:1px solid var(--line2);border-radius:10px;padding:5px 6px 5px 12px}
.tag-item input{background:transparent;border:0;outline:0;width:auto}
.ro-note{display:none}
body.ro .ro-note{display:flex}
body.ro .w-only{display:none!important}
.mt{margin-top:16px}.mb{margin-bottom:16px}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{margin-inline-start:auto}

@media (max-width:1200px){.g4{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}.mini-stats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;right:0;top:0;width:270px;transform:translateX(100%);transition:.25s}
  body.nav-open .side{transform:none;box-shadow:-20px 0 60px #000}
  .menu-btn{display:inline-grid}
  .top{padding:12px 16px}.view{padding:18px 14px 50px}
  .form{grid-template-columns:1fr}
  .podium{grid-template-columns:1fr}.pod.p1{order:-1}
  .mini-stats{grid-template-columns:repeat(2,1fr)}
  .top .sub{display:none}
  .top h2{font-size:18px}
  .top .btn span{display:none}
  .bars .col:nth-child(odd) .l{visibility:hidden}
  .hbar{grid-template-columns:90px 1fr 28px}
}
@media (max-width:520px){.g4{grid-template-columns:1fr}}
.login{position:fixed;inset:0;z-index:300;background:var(--bg);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto;
  background-image:radial-gradient(700px 400px at 50% 0%,#c8862a30,transparent 70%)}
.login.show{display:flex}
#gate{width:100%;max-width:400px;text-align:center;background:linear-gradient(180deg,#1a120a,#120c07);border:1px solid #5a3f17;border-radius:20px;padding:30px 26px;box-shadow:0 30px 80px #000}
#gate:has(form.wide){max-width:560px}
.login img{width:116px;height:116px;border-radius:50%;box-shadow:0 0 0 3px #d4a24c55,0 0 50px #d4a24c50;margin-bottom:14px}
.login h1{font-size:22px;font-weight:900;color:var(--gold2)}
.login .inp{width:100%;margin-top:12px;text-align:right}
.login .btn{width:100%;justify-content:center;margin-top:18px;padding:12px}
.login .code{text-align:center!important;font-size:28px;letter-spacing:10px;font-family:ui-monospace,Consolas,monospace;direction:ltr;padding:12px}
.gtxt{margin-top:16px;color:var(--text);font-size:14.5px;line-height:1.9}
.gerr{color:#ff9a92;font-size:13.5px;min-height:20px;margin-top:10px;font-weight:600}
.glinks{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:13px;align-items:center}
.lnk{background:none;border:0;color:var(--gold2);cursor:pointer;font-weight:700;font-family:Cairo;padding:4px}
.lnk:disabled{color:var(--dim);cursor:default}
.gform{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;text-align:right;margin-top:8px}
.gform label{font-size:13px;font-weight:700;color:var(--muted);font-family:Cairo;margin-top:8px}
.gform label .inp{margin-top:6px;font-weight:400;color:var(--text);font-family:Tajawal}
.gform .full{grid-column:1/-1}.gform i{color:var(--red);font-style:normal}
.pend-ic{width:70px;height:70px;margin:18px auto 0;border-radius:50%;display:grid;place-items:center;background:#d4a24c18;color:var(--gold)}
.pend-ic svg{width:36px;height:36px}
body.insp .a-only{display:none!important}
.code-tag{font-family:ui-monospace,Consolas,monospace;background:#0e0905;border:1px solid var(--line2);border-radius:8px;padding:3px 9px;letter-spacing:2px;color:var(--gold2);direction:ltr;display:inline-block}
.login .code{letter-spacing:6px!important;font-size:24px!important}
.av{position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.login .btn.discord{background:#5865F2;border-color:#5865F2;color:#fff;font-size:15.5px;margin-top:22px}
.login .btn.discord:hover{background:#4752c4}
.dc-card{display:flex;align-items:center;gap:12px;background:#0e0905;border:1px solid var(--line2);border-radius:14px;padding:10px 14px;margin-top:16px;text-align:right}
.dc-card b{display:block}.dc-card small{color:var(--dim);display:block}
#meBox{padding:4px 0}
#meBox .av{width:32px;height:32px;font-size:13px}
#meBox b{font-size:13.5px;color:var(--text)}

/* ============ constants ============ */
const STATUS={active:['نشط','c-green'],leave:['في إجازة','c-blue'],suspended:['موقوف','c-amber'],dismissed:['مفصول','c-red'],pending:['بانتظار الموافقة','c-violet']};
const WSTAT={approved:['معتمد','c-green'],pending:['قيد المراجعة','c-amber'],rejected:['مرفوض','c-red']};
const WLEVEL={verbal:['تنبيه شفهي','c-gray',2],w1:['إنذار أول','c-amber',5],w2:['إنذار ثاني','c-red',10],final:['إنذار نهائي','c-red',20],suspend:['إيقاف مؤقت','c-violet',30]};

const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6cmRjcXJrbWptY3lod292ZGdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2NjE2MjcsImV4cCI6MjExMDIzNzYyN30.pOlcB9bOlvaNGDZZyAfPi13_t8WIpmEp8De7LK4WMg0';  // anon public key
const S={members:{},works:{},warnings:{},leaves:{},invites:{},cfg:structuredClone(DEFAULT_CFG),board:null,boardKey:''};
let SB=null,MODE='loading',READONLY=false,RT=null,pendTimer=null;
let ME={role:'admin',memberId:null,userId:null};
const isAdmin=()=>ME.role==='admin'||ME.role==='super';
const isSuper=()=>ME.role==='super';
const ROLES={super:['مسؤول الإدارة العليا','c-gold'],admin:['الإدارة العليا','c-violet'],inspector:['الإدارة العليا','c-violet']};
const LSK='np9-rqaba-v1';
function lsLoad(){try{const d=JSON.parse(localStorage.getItem(LSK)||'null');if(d){COLS.forEach(c=>S[c]=d[c]||{});if(d.cfg)S.cfg={...DEFAULT_CFG,...d.cfg,ranks:DEFAULT_CFG.ranks};}}catch(e){}}
function lsSave(){try{localStorage.setItem(LSK,JSON.stringify({members:S.members,works:S.works,warnings:S.warnings,leaves:S.leaves,cfg:S.cfg}))}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const toSnake=k=>k.replace(/[A-Z]/g,c=>'_'+c.toLowerCase());
const toCamel=k=>k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase());
function toRow(id,o){const r={id};for(const[k,v]of Object.entries(o)){if(k==='id')continue;r[toSnake(k)]=(v===''?null:v)}return r}
function fromRow(r){const o={};for(const[k,v]of Object.entries(r)){if(k==='id'||v===null)continue;o[toCamel(k)]=v}return o}

async function put(col,id,obj){
  const existed=!!S[col][id];
  S[col][id]=obj; render();
  if(MODE==='cloud'){
    const row=toRow(id,obj);
    const {error}=existed?await SB.from(col).update(row).eq('id',id):await SB.from(col).insert(row);
    if(error){handleWriteErr(error);await loadTable(col);render()}
  }else lsSave();
}
async function del(col,id){
  delete S[col][id]; render();
  if(MODE==='cloud'){const {error}=await SB.from(col).delete().eq('id',id);if(error){handleWriteErr(error);await loadTable(col);render()}}else lsSave();
}
async function saveCfg(){
  render();
  if(MODE==='cloud'){const {error}=await SB.from('config').upsert({id:'main',data:S.cfg});if(error)handleWriteErr(error)}else lsSave();
}
function handleWriteErr(e){console.error(e);toast('تعذّر الحفظ: '+(e.message||'خطأ غير معروف'),true)}
function setConn(m,txt){
  MODE=m;const d=$('#connDot'),t=$('#connTxt');
  d.className='dot '+(m==='cloud'?'ok':m==='local'?'local':'');
  t.textContent=txt||(m==='cloud'?'متصل بـ Supabase':m==='local'?'وضع محلي — الحفظ على هذا المتصفح':'جاري الاتصال…');
  $('#logoutBtn').style.display=m==='cloud'&&ME.userId?'':'none';
}
async function loadTable(c){
  const {data,error}=await SB.from(c).select('*');
  if(error){toast('خطأ في التحميل: '+error.message,true);return}
  const m={};data.forEach(r=>m[r.id]=fromRow(r));S[c]=m;
  if(c==='members'&&ME.memberId){const me=S.members[ME.memberId];
    if(me&&(me.role||'inspector')!==ME.role)location.reload();
    if(!me||me.status==='dismissed'||me.status==='pending')resolveMe();}
}
async function loadCfg(){
  const {data}=await SB.from('config').select('data').eq('id','main').maybeSingle();
  S.cfg=data&&data.data?{...DEFAULT_CFG,...data.data,ranks:DEFAULT_CFG.ranks}:structuredClone(DEFAULT_CFG);
}
let boardBusy=false;
async function loadBoard(){
  if(MODE!=='cloud'||boardBusy)return;boardBusy=true;
  const key=F.kp,[f0,f1]=periodRange(key);
  const {data,error}=await SB.rpc('leaderboard',{p_from:f0||null,p_to:f1||null});
  boardBusy=false;if(!error){S.board=data||[];S.boardKey=key;render()}
}

/* ---------- بوابة الدخول (اسم مستخدم + كلمة مرور + أكواد تسجيل) ---------- */
function gate(html){$('#gate').innerHTML=html;$('#login').classList.add('show')}
function hideGate(){$('#login').classList.remove('show')}
const gateHead=sub=>`<img src="${LOGO}" alt="NP9"><h1>NP9 | مود الشرطة</h1><div class="muted">${sub}</div>`;
const gateOut=`<div class="glinks"><button type="button" class="lnk" onclick="doLogout()">تسجيل الخروج</button></div>`;
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const fmtCode=c=>{c=normCode(c);return c.length>4?c.slice(0,4)+'-'+c.slice(4):c};
async function ensureSession(){
  const {data:{session}}=await SB.auth.getSession();if(session)return session;
  const {data,error}=await SB.auth.signInAnonymously();
  if(error)throw new Error(/anonymous/i.test(error.message)?'لازم تفعّل Allow anonymous sign-ins في Supabase':error.message);
  return data.session;
}
function authErr(e){const m=(e?.message||'').toLowerCase();
  if(m.includes('invalid login'))return 'اسم المستخدم أو كلمة المرور غير صحيحة';
  if(m.includes('password')&&m.includes('6'))return 'كلمة المرور لازم تكون 6 أحرف أو أكثر';
  if(m.includes('signups not allowed'))return 'التسجيل مقفل في Supabase — فعّل Allow new users to sign up';
  if(m.includes('rate'))return 'محاولات كثيرة، انتظر شوي وحاول';
  return e?.message||'حدث خطأ';}
function btnBusy(b,on,txt){b.disabled=on;if(txt)b.textContent=txt}

function gateLogin(err){
  gate(`<form onsubmit="doLogin(event)">${gateHead('نظام إدارة الرقابة والتفتيش')}
   <input class="inp" name="u" required placeholder="اسم المستخدم" autocomplete="username" style="margin-top:20px">
   <input class="inp" name="p" type="password" required placeholder="كلمة المرور" autocomplete="current-password">
   <button class="btn gold" type="submit">تسجيل الدخول</button><div class="gerr" id="gerr">${esc(err||'')}</div>
   <div class="glinks"><span class="dim">أول مرة تدخل؟</span><button type="button" class="lnk" onclick="gateCode()">التسجيل بكود</button></div></form>`);
  setTimeout(()=>$('#gate input')?.focus(),50);
}
async function doLogin(e){
  e.preventDefault();const f=e.target,b=f.querySelector('button[type=submit]');$('#gerr').textContent='';
  btnBusy(b,true,'جاري الدخول…');
  try{
    const session=await ensureSession();
    const {data,error}=await SB.rpc('login',{p_username:f.u.value.trim(),p_password:f.p.value});
    if(error)throw error;
    if(!data?.ok){const M={locked:'محاولات خاطئة كثيرة — الحساب مقفل 10 دقائق',dismissed:'حسابك موقوف — تواصل مع الإدارة العليا'};
      throw new Error(M[data?.msg]||'اسم المستخدم أو كلمة المرور غير صحيحة')}
    afterAuth(session);
  }catch(err){btnBusy(b,false,'تسجيل الدخول');$('#gerr').textContent=err.message||authErr(err)}
}
let REG={};
function gateCode(){
  gate(`<form onsubmit="doCheckCode(event)">${gateHead('تسجيل حساب جديد')}
   <p class="gtxt">اكتب اسم المستخدم وكود التسجيل اللي أعطاك إياه مسؤول الإدارة العليا</p>
   <input class="inp" name="u" required placeholder="اسم المستخدم" autocomplete="username" value="${esc(REG.u||'')}">
   <input class="inp code" name="c" required placeholder="XXXX-XXXX" maxlength="12" autocomplete="off">
   <button class="btn gold" type="submit">متابعة</button><div class="gerr" id="gerr"></div>
   <div class="glinks"><span class="dim">عندك حساب؟</span><button type="button" class="lnk" onclick="gateLogin()">تسجيل الدخول</button></div></form>`);
}
async function doCheckCode(e){
  e.preventDefault();const f=e.target,b=f.querySelector('button[type=submit]');$('#gerr').textContent='';
  const u=f.u.value.trim(),c=normCode(f.c.value);if(c.length<8){$('#gerr').textContent='الكود 8 خانات';return}
  btnBusy(b,true,'جاري التحقق…');
  const {data,error}=await SB.rpc('check_invite',{p_code:c,p_username:u});
  btnBusy(b,false,'متابعة');
  if(error){$('#gerr').textContent=authErr(error);return}
  if(!data||!data.length){$('#gerr').textContent='الكود غير صحيح، أو مستخدم من قبل، أو ما يطابق اسم المستخدم';return}
  REG={u,c,role:data[0].role,rank:data[0].rank,relink:data[0].relink};gatePassword();
}
function gatePassword(setup){
  const title=setup?'إعداد حساب مسؤول الإدارة العليا':`أهلاً ${esc(REG.u)}`;
  gate(`<form onsubmit="doRegister(event,${setup?1:0})">${gateHead(title)}
   ${setup?`<p class="gtxt">هذا أول تشغيل للنظام — سوّ حساب <b>مسؤول الإدارة العليا</b> (حسابك أنت)</p>
     <input class="inp" name="u" required placeholder="اسم المستخدم" autocomplete="username">`
    :`<div class="dc-card"><div class="av"><span>${esc(initials(REG.u))}</span></div><div><b>${esc(REG.u)}</b><small>${esc(ROLES[REG.role]?.[0]||'')}${REG.rank?' · '+esc(REG.rank):''}</small></div><span class="chip c-green right">الكود صحيح ✓</span></div>
     <p class="gtxt">${REG.relink?'سوّ كلمة مرور جديدة لحسابك':'سوّ كلمة مرور لحسابك — بتدخل فيها كل مرة باسم المستخدم'}</p>`}
   <input class="inp" name="p" type="password" required minlength="6" placeholder="كلمة المرور (6 أحرف أو أكثر)" autocomplete="new-password">
   <input class="inp" name="p2" type="password" required minlength="6" placeholder="تأكيد كلمة المرور" autocomplete="new-password">
   <button class="btn gold" type="submit">${setup?'إنشاء الحساب':'إنشاء الحساب والدخول'}</button><div class="gerr" id="gerr"></div>
   ${setup?'':`<div class="glinks"><span></span><button type="button" class="lnk" onclick="gateCode()">رجوع</button></div>`}</form>`);
  setTimeout(()=>$('#gate input')?.focus(),50);
}
async function doRegister(e,setup){
  e.preventDefault();const f=e.target,b=f.querySelector('button[type=submit]');$('#gerr').textContent='';
  if(f.p.value!==f.p2.value){$('#gerr').textContent='كلمتين المرور مو متطابقة';return}
  if(f.p.value.length<6){$('#gerr').textContent='كلمة المرور لازم تكون 6 أحرف أو أكثر';return}
  const username=setup?f.u.value.trim():REG.u;if(!username)return;
  btnBusy(b,true,'جاري الإنشاء…');
  try{
    const session=await ensureSession();
    const r=setup?await SB.rpc('bootstrap_super',{p_username:username,p_password:f.p.value})
                 :await SB.rpc('redeem_invite',{p_code:REG.c,p_username:REG.u,p_password:f.p.value});
    if(r.error)throw r.error;
    REG={};afterAuth(session);
  }catch(err){btnBusy(b,false,'إنشاء الحساب');$('#gerr').textContent=err.message||'حدث خطأ'}
}
async function afterAuth(session){
  ME.userId=session.user.id;
  setConn('cloud','جاري التحميل…');await loadCfg();await resolveMe();
}
async function resolveMe(){
  const {data:mid}=await SB.rpc('whoami');
  if(!mid){setConn('loading','بانتظار تسجيل الدخول');const {data:has}=await SB.rpc('has_super');if(has===false)gatePassword(true);else gateLogin(ME.memberId?'انتهت جلستك — سجّل دخولك من جديد':'');ME.memberId=null;return}
  const {data,error}=await SB.from('members').select('*').eq('id',mid).maybeSingle();
  if(error||!data){gate(`${gateHead('حدث خطأ')}<p class="gerr">${esc(error?.message||'تعذّر تحميل بياناتك')}</p>${gateOut}`);return}
  const m=fromRow(data);ME.memberId=data.id;ME.role=m.role||'inspector';S.members[data.id]=m;
  if(m.status==='dismissed'){gate(`${gateHead('تم إيقاف الوصول')}<p class="gtxt">حسابك غير مفعّل في فريق الرقابة والتفتيش. تواصل مع الإدارة العليا.</p>${gateOut}`);return}
  hideGate();enterApp();
}
let appStarted=false;
function enterApp(){
  document.body.classList.toggle('insp',!isAdmin());
  document.body.classList.toggle('super',isSuper());
  const m=S.members[ME.memberId]||{};
  $('#meBox').innerHTML=`<div class="person">${avHTML(m)}<div style="min-width:0"><b>${esc(m.name||'')}</b><small>${esc(ROLES[ME.role]?.[0]||'')}</small></div></div>`;
  setConn('cloud');
  if(!PAGES().some(p=>p[0]===location.hash.slice(1)))location.hash=PAGES()[0][0];
  route();
  Promise.all([...COLS.map(loadTable),loadCfg(),isSuper()?loadTable('invites'):null]).then(()=>{render();loadBoard()});
  if(appStarted)return;appStarted=true;
  const timers={};
  RT=SB.channel('np9-live').on('postgres_changes',{event:'*',schema:'public'},p=>{
    const t=p.table;if(t==='invites'&&!isSuper())return;clearTimeout(timers[t]);
    timers[t]=setTimeout(async()=>{await(t==='config'?loadCfg():loadTable(t));render();if(!['config','members','invites'].includes(t))loadBoard()},400);
  }).subscribe();
}
async function boot(){
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY||!window.supabase){lsLoad();ME.role='admin';setConn('local');render();return}
  SB=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  setConn('loading','بانتظار تسجيل الدخول');
  const {data:{session}}=await SB.auth.getSession();
  if(session){afterAuth(session);return}
  const {data:has,error}=await SB.rpc('has_super');
  if(error){gateLogin('تعذّر الاتصال بقاعدة البيانات: '+error.message);return}
  if(has===false)gatePassword(true);else gateLogin();
}
async function doLogout(){if(SB){try{await SB.rpc('logout')}catch(e){}await SB.auth.signOut();location.hash='';location.reload()}}

/* ---------- أكواد التسجيل (مسؤول الإدارة العليا) ---------- */
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=new Uint32Array(8);crypto.getRandomValues(r);return [...r].map(x=>A[x%A.length]).join('')}
function inviteMsg(i){return `🔐 دعوة نظام الرقابة والتفتيش — NP9 | مود الشرطة
اسم المستخدم: ${i.username}
كود التسجيل: ${fmtCode(i.id)}
الرابط: ${location.origin+location.pathname}

ادخل الرابط ← "التسجيل بكود" ← اكتب اسم المستخدم والكود ← سوّ كلمة المرور.
⚠️ الكود يُستخدم مرة وحدة فقط.`}
function vInvites(){
  const I=arr('invites').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const unused=I.filter(i=>!i.usedAt).length;
  return `<div class="bar"><span class="muted">${I.length} كود · ${unused} غير مستخدم</span><button class="btn gold right" onclick="formInvite()">${ic('plus',2.4)} إصدار كود جديد</button></div>
  ${I.length?`<div class="tbl-wrap"><table><thead><tr><th>اسم المستخدم</th><th>الصلاحية</th><th>الرتبة</th><th>الكود</th><th>الحالة</th><th>تاريخ الإصدار</th><th></th></tr></thead><tbody>

function formInvite(memberId){
  if(!isSuper()){toast('هذي الصلاحية لمسؤول الإدارة العليا فقط',true);return}
  const m=memberId?S.members[memberId]:null;const code=genCode();
  openModal(m?'إعادة تعيين حساب':'إصدار كود تسجيل',`<div class="form">
   ${m&&m.hasLogin?`<div class="alert amber full">${ic('info')}<div>بيتم إلغاء كلمة مرور <b>${esc(m.name)}</b> الحالية ويطلع من كل الأجهزة، ويسجّل من جديد بالكود ويسوي كلمة مرور جديدة. بياناته وأعماله تبقى كما هي.</div></div>`:''}
   ${fld('اسم المستخدم (المسمى)',`<input class="inp" name="username" required value="${esc(m?(m.username||m.name):'')}" placeholder="الاسم اللي بيدخل فيه">`,1,1)}
   ${fld('الرتبة / الصلاحية',`<input class="inp" value="الإدارة العليا" disabled>`,1)}
   ${fld('كود التسجيل',`<input class="inp" value="${fmtCode(code)}" disabled style="font-family:ui-monospace,Consolas,monospace;font-size:20px;letter-spacing:4px;text-align:center;direction:ltr"><div class="hint">يتولّد تلقائياً — يُستخدم مرة وحدة فقط</div>`,1)}
  </div>`,async fd=>{
    const o=Object.fromEntries(fd);const u=o.username.trim();if(!u)return false;
    const taken=arr('members').some(x=>x.id!==memberId&&(x.username||'').toLowerCase()===u.toLowerCase())||arr('invites').some(x=>!x.usedAt&&x.username.toLowerCase()===u.toLowerCase());
    if(taken){toast('اسم المستخدم مستخدم أو له كود ما انستخدم',true);return false}
    const inv={username:u,role:'admin',rank:'الإدارة العليا',memberId:memberId||'',createdAt:Date.now()};
    if(m&&m.hasLogin){const {error}=await SB.rpc('reset_member_login',{p_member_id:memberId});if(error){toast(error.message,true);return false}S.members[memberId]={...m,hasLogin:false}}
    await put('invites',code,inv);
    setTimeout(()=>openModal('تم إصدار الكود ✓',`<p class="muted mb">أرسل هذي الرسالة للشخص (مثلاً في الديسكورد):</p><div class="pre">${esc(inviteMsg({id:code,...inv}))}</div><button class="btn gold mt" onclick="copyTxt(inviteMsg({id:'${code}',...S.invites['${code}']}))">${ic('copy')} نسخ الرسالة</button>`,null),50);
  },'إصدار الكود');
}

/* ============ helpers ============ */
function $(s){return document.querySelector(s)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const fmtD=s=>{if(!s)return '—';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('ar-u-nu-latn',{day:'numeric',month:'short',year:'numeric'})};
const fmtShort=s=>new Date(s+'T00:00:00').toLocaleDateString('ar-u-nu-latn',{day:'numeric',month:'numeric'});
const ago=ts=>{const s=(Date.now()-ts)/1000;if(s<60)return 'الآن';if(s<3600)return `قبل ${Math.floor(s/60)} د`;if(s<86400)return `قبل ${Math.floor(s/3600)} س`;const d=Math.floor(s/86400);return d===1?'أمس':`قبل ${d} يوم`};
const chip=([t,c])=>`<span class="chip ${c}">${esc(t)}</span>`;
const initials=n=>{const p=String(n||'?').trim().split(/\s+/);return (p[0]?.[0]||'?')+(p[1]?.[0]||'')};
const arr=c=>Object.entries(S[c]).map(([id,v])=>({id,...v}));
const team=()=>arr('members').filter(m=>m.status!=='pending');
const mem=id=>S.members[id];
const mName=id=>mem(id)?.name||'عضو محذوف';
function avHTML(m,cls='',style=''){return `<div class="av ${cls}" style="${style}">${m&&m.avatarUrl?`<img src="${esc(m.avatarUrl)}" alt="" onerror="this.remove()">`:''}<span>${esc(initials(m?.name))}</span></div>`}
function person(id,sub){return personM(mem(id),sub)}
function personM(m,sub){return `<div class="person">${avHTML(m)}<div style="min-width:0"><b>${esc(m?.name||'عضو محذوف')}</b><small>${esc(sub??(m?.rank||''))}</small></div></div>`}
function toast(t,err){const e=document.createElement('div');e.className='toast'+(err?' err':'');e.textContent=t;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),3200)}
function canW(){if(READONLY){toast('وضع العرض فقط',true);return false}return true}
const typePts=n=>(S.cfg.workTypes.find(t=>t.n===n)||{}).p??5;
function isOnLeave(mid,day=today()){return arr('leaves').some(l=>l.memberId===mid&&l.status==='approved'&&l.type==='leave'&&l.from<=day&&(l.to||l.from)>=day)}
function warnActive(w){return w.status==='active'&&(!w.expires||w.expires>=today())}

function statsFor(mid,from,to){
  const inR=d=>(!from||d>=from)&&(!to||d<=to);
  const works=arr('works').filter(w=>w.memberId===mid&&inR(w.date));
  const appr=works.filter(w=>w.status==='approved');
  const warns=arr('warnings').filter(w=>w.memberId===mid&&inR(w.date)&&w.status!=='cancelled');
  const activeW=arr('warnings').filter(w=>w.memberId===mid&&warnActive(w));
  const leaves=arr('leaves').filter(l=>l.memberId===mid&&inR(l.from)&&l.status!=='rejected');
  const pts=appr.reduce((a,w)=>a+(+w.points||0),0);
  const pen=warns.reduce((a,w)=>a+(WLEVEL[w.level]?.[2]||0),0);
  const lastWork=works.map(w=>w.date).sort().pop()||null;
  const absent=leaves.filter(l=>l.type==='absent').length;
  return {works,appr,warns,activeW,leaves,pts,pen,score:pts-pen-absent*5,lastWork,absent};
}

    if(!S.board)return '<div class="card empty">جاري تحميل الترتيب…</div>';
  }else R=team().filter(m=>m.status!=='dismissed').map(m=>({m,s:statsFor(m.id,f0,f1)})).sort((a,b)=>b.s.score-a.s.score||b.s.appr.length-a.s.appr.length);

  <div class="tbl-wrap"><table><thead><tr><th>#</th><th>العضو</th><th>أعمال معتمدة</th><th>نقاط الأعمال</th><th>الإنذارات</th><th>خصم</th><th>غياب بدون عذر</th><th>المجموع</th></tr></thead><tbody>
  ${R.map((x,i)=>`<tr class="${can(x.m.id)?'clickable':''}" ${oc(x.m.id)} style="${x.m.id===ME.memberId&&!isAdmin()?'background:#d4a24c14':''}"><td class="rank-n" style="${i<3?'color:var(--gold2)':''}">${i+1}</td><td>${personM(x.m)}</td><td>${x.s.appr.length}</td><td style="color:var(--green)">+${x.s.pts}</td><td>${x.s.warns.length}</td><td style="color:var(--red)">${x.s.pen?'-'+x.s.pen:'0'}</td><td>${x.s.absent}</td><td class="score" style="font-size:17px">${x.s.score}</td></tr>`).join('')}
  </tbody></table></div>`;

function vReports(){
  let [f0,f1]=F.rp==='custom'?[F.rFrom,F.rTo]:periodRange(F.rp);
  const R=team().filter(m=>m.status!=='dismissed').map(m=>({m,s:statsFor(m.id,f0,f1)})).sort((a,b)=>b.s.score-a.s.score);
  const totW=R.reduce((a,x)=>a+x.s.appr.length,0),totX=R.reduce((a,x)=>a+x.s.warns.length,0);
  const inactive=R.filter(x=>x.m.status==='active'&&!x.s.works.length);
  const label=f0?`من ${fmtD(f0)} إلى ${fmtD(f1||today())}`:'كل الفترات';
  const txt=reportText(R,label,totW,totX,inactive);
  window._rep=txt;
  return `<div class="bar"><div class="seg">${[['week','أسبوعي'],['month','شهري'],['quarter','ربع سنوي'],['all','الكل'],['custom','مخصص']].map(([v,t])=>`<button class="${F.rp===v?'on':''}" onclick="setF('rp','${v}')">${t}</button>`).join('')}</div>
  ${F.rp==='custom'?`<input type="date" class="inp" value="${F.rFrom}" onchange="setF('rFrom',this.value)"><span class="muted">إلى</span><input type="date" class="inp" value="${F.rTo}" onchange="setF('rTo',this.value)">`:''}
  <span class="muted">${label}</span></div>
  <div class="grid g4 mb">
    <div class="card stat"><div class="k">أعمال معتمدة</div><div class="v">${totW}</div></div>
    <div class="card stat red"><div class="k">إنذارات</div><div class="v">${totX}</div></div>
    <div class="card stat blue"><div class="k">أعضاء بدون أعمال</div><div class="v">${inactive.length}</div></div>
    <div class="card stat green"><div class="k">متوسط الأعمال للعضو</div><div class="v">${R.length?(totW/R.length).toFixed(1):0}</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>${ic('report')} تفصيل الأداء</h3><div class="tbl-wrap"><table><thead><tr><th>العضو</th><th>أعمال</th><th>نقاط</th><th>إنذارات</th><th>إجازات/غياب</th><th>المجموع</th></tr></thead><tbody>
    ${R.map(x=>`<tr class="clickable" onclick="openProfile('${x.m.id}')"><td>${person(x.m.id)}</td><td>${x.s.appr.length}</td><td>${x.s.pts}</td><td>${x.s.warns.length}</td><td>${x.s.leaves.length}</td><td class="score">${x.s.score}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا يوجد</td></tr>'}
    </tbody></table></div></div>
    <div class="card"><div class="card-head"><h3>${ic('copy')} تقرير جاهز لديسكورد</h3><button class="btn gold sm" onclick="copyTxt(window._rep)">${ic('copy')} نسخ</button></div><div class="pre">${esc(txt)}</div></div>
  </div>`;
}
function reportText(R,label,totW,totX,inactive){
  const L=[];L.push('# 📋 تقرير الرقابة والتفتيش — NP9');L.push(`**الفترة:** ${label}`);L.push('');
  L.push(`✅ الأعمال المعتمدة: **${totW}**`);L.push(`⚠️ الإنذارات: **${totX}**`);L.push(`👥 عدد الأعضاء: **${R.length}**`);L.push('');
  L.push('## 🏆 ترتيب الأعضاء');
  R.forEach((x,i)=>{const md=['🥇','🥈','🥉'][i]||`${i+1}.`;L.push(`${md} **${x.m.name}** — ${x.s.score} نقطة (${x.s.appr.length} عمل${x.s.warns.length?` · ${x.s.warns.length} إنذار`:''})`)});
  if(inactive.length){L.push('');L.push('## 🔻 بدون أعمال خلال الفترة');inactive.forEach(x=>L.push(`- ${x.m.name}`))}
  const aw=arr('warnings').filter(warnActive);
  if(aw.length){L.push('');L.push('## ⚠️ الإنذارات الفعّالة');aw.forEach(w=>L.push(`- ${mName(w.memberId)}: ${WLEVEL[w.level]?.[0]} — ${w.reason}`))}
  L.push('');L.push(`> صادر من: ${S.cfg.supervisor||'مسؤول الرقابة والتفتيش'}`);
  return L.join('\n');
}

function formLeave(preMember,id){
  if(!canW())return;const A=isAdmin();if(A&&!team().length){toast('أضف عضواً أولاً',true);location.hash='members';return}
  const l=id?S.leaves[id]:{from:today(),to:today(),type:'leave',status:A?'approved':'pending',memberId:preMember||(A?'':ME.memberId)};
  const LT=A?LTYPE:{leave:LTYPE.leave,excused:LTYPE.excused};
  openModal(id?'تعديل سجل':A?'تسجيل إجازة / غياب':'طلب إجازة',`<div class="form">
   ${A?fld('العضو',`<select class="inp" name="memberId" required>${memberOpts(l.memberId)}</select>`,1,1):''}
   ${fld('النوع',`<select class="inp" name="type">${opts(LT,l.type)}</select>`,!A)}
   ${A?fld('الحالة',`<select class="inp" name="status">${opts(LSTAT,l.status)}</select>`):''}
   ${fld('من',`<input class="inp" type="date" name="from" required value="${l.from}">`)}
   ${fld('إلى',`<input class="inp" type="date" name="to" value="${l.to||''}">`)}
   ${fld('السبب',`<textarea class="inp" name="reason">${esc(l.reason||'')}</textarea>`,1)}
  </div>`,fd=>{const o=Object.fromEntries(fd);if(!A){o.memberId=ME.memberId;o.status='pending'}if(!o.memberId){toast('اختر العضو',true);return false}if(o.to&&o.to<o.from){toast('تاريخ النهاية قبل البداية',true);return false}put('leaves',id||uid(),{...(id?S.leaves[id]:{createdAt:Date.now()}),...o});toast('تم الحفظ ✓')});
}

/* ---- profile ---- */
let pTab='works',pId=null;
function openProfile(id){pId=id;pTab='timeline';drawProfile()}
function drawProfile(){
  const m=S.members[pId];if(!m){closeModal();return}
  const s=statsFor(pId);const [f0,f1]=periodRange('month');const sm=statsFor(pId,f0,f1);
  const st=isOnLeave(pId)&&m.status==='active'?STATUS.leave:STATUS[m.status]||STATUS.active;
  const allW=s.works.sort((a,b)=>b.date.localeCompare(a.date));
  const allX=arr('warnings').filter(w=>w.memberId===pId).sort((a,b)=>b.date.localeCompare(a.date));
  const allL=s.leaves.sort((a,b)=>b.from.localeCompare(a.from));
  const tl=[...allW.map(w=>({d:w.date,c:w.status==='rejected'?'red':'',h:`<b>${esc(w.type)}</b> — ${esc(w.title||'')} ${chip(WSTAT[w.status])}`,s:`${w.status==='approved'?'+'+w.points+' نقطة':''}${w.location?' · '+esc(w.location):''}`})),
    ...allX.map(w=>({d:w.date,c:'red',h:`${chip(WLEVEL[w.level])} ${esc(w.reason)}`,s:`صادر من ${esc(w.issuedBy||'—')}${w.status==='cancelled'?' · ملغى':''}`})),
    ...allL.map(l=>({d:l.from,c:'blue',h:`${chip(LTYPE[l.type])} ${fmtD(l.from)}${l.to&&l.to!==l.from?' ← '+fmtD(l.to):''}`,s:esc(l.reason||'')})),
    ...(m.joined?[{d:m.joined,c:'green',h:'<b>انضم إلى فريق الرقابة والتفتيش</b>',s:esc(m.rank||'')}]:[])].sort((a,b)=>b.d.localeCompare(a.d));
  const tabs=[['timeline','السجل الزمني'],['works',`الأعمال (${allW.length})`],['warnings',`الإنذارات (${allX.length})`],['leaves',`الإجازات (${allL.length})`]];
  let body='';
  if(pTab==='timeline')body=tl.length?`<div class="timeline">${tl.map(x=>`<div class="tl ${x.c}"><div class="dim" style="font-size:12px">${fmtD(x.d)}</div><div>${x.h}</div>${x.s?`<div class="dim" style="font-size:12.5px">${x.s}</div>`:''}</div>`).join('')}</div>`:'<div class="empty">لا يوجد سجل بعد</div>';
  if(pTab==='works')body=allW.length?`<div class="list">${allW.map(w=>`<div class="li"><div class="grow"><div class="t">${esc(w.title||w.type)}</div><div class="d">${esc(w.type)} · ${fmtD(w.date)}</div></div>${chip(WSTAT[w.status])}<span class="score">${w.points}</span><button type="button" class="icon-btn" onclick="viewWork('${w.id}')">${ic('eye')}</button></div>`).join('')}</div>`:'<div class="empty">لا توجد أعمال</div>';
  if(pTab==='warnings')body=allX.length?`<div class="list">${allX.map(w=>`<div class="li"><div class="grow"><div class="t">${esc(w.reason)}</div><div class="d">${fmtD(w.date)} · ينتهي: ${w.expires?fmtD(w.expires):'دائم'} · ${esc(w.issuedBy||'')}</div></div>${chip(WLEVEL[w.level])}${chip(warnActive(w)?WARNST.active:w.status==='cancelled'?WARNST.cancelled:WARNST.expired)}</div>`).join('')}</div>`:'<div class="empty">سجل نظيف — لا توجد إنذارات</div>';
  if(pTab==='leaves')body=allL.length?`<div class="list">${allL.map(l=>`<div class="li"><div class="grow"><div class="t">${fmtD(l.from)} ← ${fmtD(l.to||l.from)} <span class="dim">(${daysBetween(l.from,l.to||l.from)+1} يوم)</span></div><div class="d">${esc(l.reason||'')}</div></div>${chip(LTYPE[l.type])}${chip(LSTAT[l.status])}</div>`).join('')}</div>`:'<div class="empty">لا توجد إجازات</div>';
  openModal('ملف العضو',`
   <div class="prof-head">${avHTML(m,'lg')}<div style="flex:1;min-width:200px"><h2>${esc(m.name)}</h2><div class="flex">${chip([m.rank||'—','c-gold'])}${chip(st)}${m.badge?`<span class="dim">#${esc(m.badge)}</span>`:''}${m.discordId?`<span class="dim" style="direction:ltr">${esc(m.discordId)}</span>`:''}</div><div class="dim mt" style="font-size:13px;margin-top:6px">انضم: ${fmtD(m.joined)} · آخر عمل: ${s.lastWork?fmtD(s.lastWork):'لا يوجد'}</div></div>
   <div class="flex w-only"><button type="button" class="btn sm gold" onclick="${isAdmin()||pId===ME.memberId?`formWork(null,'${pId}')`:''}">${ic('plus',2.4)} عمل</button><button type="button" class="btn sm red a-only" onclick="formWarning('${pId}')">${ic('warn')} إنذار</button><button type="button" class="btn sm" onclick="formLeave('${pId}')">${ic('leave')} إجازة</button><button type="button" class="btn sm a-only" onclick="formMember('${pId}')">${ic('edit')}</button></div></div>
   ${m.notes?`<div class="alert amber" style="margin-bottom:14px">${ic('info')}<div>${esc(m.notes)}</div></div>`:''}
   <div class="mini-stats"><div class="mini"><b>${s.score}</b><span>مجموع النقاط</span></div><div class="mini"><b>${sm.score}</b><span>نقاط هذا الشهر</span></div><div class="mini"><b>${s.appr.length}</b><span>أعمال معتمدة</span></div><div class="mini"><b style="color:${s.activeW.length?'#ff9a92':''}">${s.activeW.length}</b><span>إنذارات فعّالة</span></div><div class="mini"><b>${s.leaves.length}</b><span>إجازات/غياب</span></div></div>
   <div class="tabs">${tabs.map(([k,t])=>`<button type="button" class="${pTab===k?'on':''}" onclick="pTab='${k}';drawProfile()">${t}</button>`).join('')}</div>
   ${body}`,null,'',true);
}

/* ============ init ============ */
$('#today').textContent=new Date().toLocaleDateString('ar-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
route();boot();
</script>
</body>
</html>
